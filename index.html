<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन और रजिस्ट्रेशन - गेमिंग वेब</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: white; }
        .container { background-color: #21213e; padding: 40px; border-radius: 15px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); width: 380px; text-align: center; }
        .logo { width: 80px; height: 80px; background-color: #4b306e; border-radius: 50%; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #ffcc00; border: 3px solid #ffcc00; }
        h2 { color: white; margin-bottom: 30px; font-size: 24px; font-weight: bold; }
        .input-group { display: flex; align-items: center; background-color: #333355; border-radius: 25px; margin-bottom: 20px; overflow: hidden; }
        .input-group i { padding: 15px; color: #ffcc00; font-size: 18px; background-color: #4b306e; height: 100%; }
        .input-group input { flex-grow: 1; border: none; padding: 15px 15px 15px 10px; background: transparent; color: white; font-size: 16px; outline: none; }
        .input-group input::placeholder { color: #aaaaaa; }
        button { width: 100%; padding: 15px; background-color: #7b2cbf; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 10px; transition: background-color 0.3s; }
        button:hover { background-color: #9d4edd; }
        .switch-link { margin-top: 25px; font-size: 14px; }
        .switch-link a { color: #ffcc00; text-decoration: none; font-weight: bold; cursor: pointer; }
        .auth-message { margin-top: 20px; font-size: 14px; font-weight: bold; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo"><i class="fas fa-crown"></i></div>
        
        <div id="register-view"> 
            <h2>Register Your Account</h2>
            <form id="registration-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="reg-username" placeholder="Enter Username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-mobile-alt"></i>
                    <input type="tel" id="reg-mobile" placeholder="Enter Mobile number" pattern="[0-9]{10}" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg-password" placeholder="Enter Password" minlength="6" required>
                </div>
                 <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg-confirm-password" placeholder="Confirm Password" minlength="6" required>
                </div>
                <button type="submit">REGISTER</button>
            </form>
            <p class="switch-link">
                Already have an account? <a onclick="showLogin()">Login Here</a>
            </p>
        </div>
        
        <div id="login-view" class="hidden">
            <h2>Login to Your Account</h2>
            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-mobile-alt"></i>
                    <input type="tel" id="log-mobile" placeholder="Enter Mobile number" pattern="[0-9]{10}" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="log-password" placeholder="Enter Password" required>
                </div>
                <button type="submit">LOGIN</button>
            </form>
            <p class="switch-link">
                Don't have an account? <a onclick="showRegister()">Register Here</a>
            </p>
        </div>
        
        <div id="dashboard-view" class="hidden">
            <h2 id="welcome-message"></h2>
            <p style="color: #66ff66; font-size: 18px; margin-bottom: 30px;">आप सफलतापूर्वक लॉग इन हैं।</p>
            <button onclick="handleLogout()">LOGOUT</button>
        </div>

        <div id="auth-message" class="auth-message"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <script>
        // ===========================================
        // 1. FIREBASE कॉन्फ़िग और इनिशियलाइज़ेशन
        // ===========================================
        const firebaseConfig = {
          apiKey: "AIzaSyBENiVdiQfZa1RKiRereAx4YWyvQMr27Aw",
          authDomain: "game-data-79d88.firebaseapp.com",
          projectId: "game-data-79d88",
          storageBucket: "game-data-79d88.appspot.com",
          messagingSenderId: "311179311352",
          appId: "1:311179311352:web:56fcac50687ada70f2e30d"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); 
        
        const DOMAIN_SUFFIX = "@mobileauth.com"; 
        function getEmailFromMobile(mobileNumber) { return mobileNumber + DOMAIN_SUFFIX; }
        
        function displayMessage(message, isError = true) {
            let messageElement = document.getElementById('auth-message');
            if (messageElement) {
                messageElement.textContent = message;
                messageElement.style.color = isError ? '#ff6666' : '#66ff66';
            }
        }

        // ===========================================
        // 2. व्यू टॉगल करने के फ़ंक्शन्स
        // ===========================================
        const registerView = document.getElementById('register-view');
        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        
        function showRegister() {
            registerView.classList.remove('hidden');
            loginView.classList.add('hidden');
            dashboardView.classList.add('hidden');
            displayMessage('', false);
        }

        function showLogin() {
            loginView.classList.remove('hidden');
            registerView.classList.add('hidden');
            dashboardView.classList.add('hidden');
            displayMessage('', false);
        }
        
        function showDashboard(user) {
            dashboardView.classList.remove('hidden');
            loginView.classList.add('hidden');
            registerView.classList.add('hidden');
            const name = user.displayName || user.email.split('@')[0];
            document.getElementById('welcome-message').textContent = `WELCOME, ${name.toUpperCase()}!`;
        }

        // ===========================================
        // 3. FIREBASE ऑथेंटिकेशन लॉजिक
        // ===========================================

        // रजिस्ट्रेशन हैंडलर
        document.getElementById('registration-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            displayMessage('', false); 

            const username = document.getElementById('reg-username').value;
            const mobile = document.getElementById('reg-mobile').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) {
                displayMessage("❌ पासवर्ड मेल नहीं खा रहे हैं।");
                return;
            }
            
            const email = getEmailFromMobile(mobile);
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                await userCredential.user.updateProfile({ displayName: username });
                
                displayMessage("✅ रजिस्ट्रेशन सफल! अब लॉगिन करें।", false);
                setTimeout(showLogin, 2000); 

            } catch (error) {
                console.error("रजिस्ट्रेशन त्रुटि:", error);
                
                let errorMessage = "❌ त्रुटि: कोई यूज़र नहीं बन पाया।";
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = "❌ यह मोबाइल नंबर पहले से ही पंजीकृत है।";
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = "❌ पासवर्ड बहुत कमज़ोर है (कम से कम 6 अक्षर चाहिए)।";
                } else if (error.code === 'auth/network-request-failed') {
                    errorMessage = "❌ नेटवर्क त्रुटि। कृपया इंटरनेट जाँचें।";
                } else {
                    errorMessage = `❌ त्रुटि कोड: ${error.code}`;
                }
                displayMessage(errorMessage);
            }
        });

        // लॉगिन हैंडलर
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            displayMessage('', false); 

            const mobile = document.getElementById('log-mobile').value;
            const password = document.getElementById('log-password').value;
            const email = getEmailFromMobile(mobile); 
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                
                displayMessage(`🎉 लॉगिन सफल!`, false);
                setTimeout(() => showDashboard(userCredential.user), 1000);

            } catch (error) {
                console.error("लॉगिन त्रुटि:", error);
                let errorMessage = "लॉगिन में कोई समस्या आई।";

                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMessage = "❌ गलत मोबाइल नंबर या पासवर्ड।";
                } else if (error.code === 'auth/network-request-failed') {
                    errorMessage = "❌ नेटवर्क त्रुटि। कृपया इंटरनेट जाँचें।";
                }
                displayMessage(errorMessage);
            }
        });

        // लॉगआउट हैंडलर
        async function handleLogout() {
            try {
                await auth.signOut();
                displayMessage("आप सफलतापूर्वक लॉगआउट हो गए हैं।", false);
                setTimeout(showLogin, 1000); 
            } catch (error) {
                console.error("लॉगआउट त्रुटि:", error);
                displayMessage("लॉगआउट में कोई समस्या आई।");
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
             showRegister(); 
        });
        
    </script>
</body>
    </html>
